<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Take Quiz</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><div class="brand">QuizMaster</div><a class="nav-link" href="/">Exit</a></header><main class="quiz-container"><div class="quiz-head"><div><span class="badge">ONLINE QUIZ</span><h2 id="welcome">Welcome</h2><p class="muted" id="progress">Loading questions…</p></div><div class="timer" id="timer">05:00</div></div><div class="progress"><div id="progressBar" style="width:0%"></div></div><section id="questionArea" class="card">Loading quiz…</section><div class="quiz-actions"><button id="prevBtn" class="btn secondary hidden" onclick="previousQuestion()">← Previous</button><button id="nextBtn" class="btn primary hidden" onclick="nextQuestion()">Next →</button><button id="submitBtn" class="btn success hidden" onclick="submitQuiz()">Submit Quiz</button></div></main><script src="/quiz.js"></script></body></html>
