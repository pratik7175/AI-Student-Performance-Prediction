<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Admin Panel</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><div class="brand">QuizMaster · Admin</div><nav><a href="/">Student Home</a> <a href="/logout">Logout</a></nav></header><main class="container"><span class="badge">MANAGEMENT</span><h1>Admin Panel</h1><p class="muted">Add questions, remove questions, and review quiz results.</p><div class="admin-grid"><section class="card"><h3>Add a Question</h3><form id="questionForm"><label for="questionText">Question</label><input id="questionText" name="questionText" required maxlength="1000" placeholder="Enter question"><label for="optionA">Option A</label><input id="optionA" name="optionA" required><label for="optionB">Option B</label><input id="optionB" name="optionB" required><label for="optionC">Option C</label><input id="optionC" name="optionC" required><label for="optionD">Option D</label><input id="optionD" name="optionD" required><label for="correctAnswer">Correct Answer</label><select id="correctAnswer" name="correctAnswer" required><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select><label for="category">Category</label><input id="category" name="category" value="General"><button class="btn primary" type="submit">Add Question</button></form></section><section class="card"><h3>Quiz Results</h3><div id="results"><p class="muted">Loading results…</p></div></section></div><section class="card"><h3>Question Bank</h3><div class="table-wrap"><table><thead><tr><th>ID</th><th>Question</th><th>Category</th><th>Action</th></tr></thead><tbody id="questions"><tr><td colspan="4">Loading questions…</td></tr></tbody></table></div></section></main><footer>Admin tools are intended for local college project demonstration.</footer><script src="/admin.js"></script></body></html>
